[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-enricher"
version = "0.1.0"
description = "Local BOM validation and ERP workbook preparation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.package-data]
bom_enricher = ["static/*.html"]
