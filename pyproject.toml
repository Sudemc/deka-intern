[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-enricher"
version = "0.1.0"
description = "Local BOM validation and ERP workbook preparation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
    "requests",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27,<1", "reportlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.package-data]
bom_enricher = ["static/*.html"]
